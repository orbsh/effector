[workspace]
resolver = "2"
members = ["crates/protocol", "crates/config", "crates/runtime"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
# The standing rule: a fallible step returns `Result`, an absent value returns
# `Option`, and neither is short-circuited by a panic. deny (not forbid) so a
# genuinely impossible state can carry a narrow, commented allow.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
