[package]
name = "effector-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
effector-protocol = { path = "../protocol" }
effector-config = { path = "../config" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = "0.24"
ureq = "2"
sandbox-runtime = { git = "https://github.com/wangyedev/sandbox-runtime-rs" }
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
steel-core = { version = "0.7", optional = true }
im-rc = { version = "15.1.0", optional = true }
pyo3 = { version = "0.29", optional = true, features = ["auto-initialize"] }
okm-python = { git = "https://github.com/orbsh/okm", default-features = false, optional = true }
okm-steel = { git = "https://github.com/orbsh/okm", optional = true }
# bgi/exec CBOR encoding (ADR-0037 §2, dual-protocol) — not feature-gated:
# the process carriers have no gate; wasmtime rides it too.
ciborium = { version = "0.2" }

[features]
default = ["steel"]
steel = ["dep:steel-core", "dep:im-rc", "dep:okm-steel"]
python = ["dep:pyo3", "dep:okm-python"]
# (the nushell PTY feature retired per ADR-0035 §6 — nu rides the bgi
# carrier's fifo adapter, which needs no feature gate: spawn + pipes only.)

[dev-dependencies]
tempfile = "3"
okm-core = { git = "https://github.com/orbsh/okm", default-features = false, features = ["test-engines"] }
okm-wire = { git = "https://github.com/orbsh/okm" }
base64 = "0.22"

[[test]]
name = "py_introspect"
required-features = ["python"]

[[test]]
name = "py_merge"
required-features = ["python"]

[[test]]
name = "py_schema"
required-features = ["python"]
