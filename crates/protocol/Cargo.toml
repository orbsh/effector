[package]
name = "effector-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# The resource shapes below are a shared RULE, not just types: the plane validates a declaration at
# the operator's door with the same function the node runs when it moves the data.
anyhow = "1"
# The pipe protocol owns its frame vocabulary and its codec declaration
# (ADR-0001 §Consequences: effector takes induction-protocol for frames and
# the codec enum) — `ToolCall.encoding` is that type, not a second copy.
induction-protocol = { path = "../../../induction/crates/induction-protocol" }

[dev-dependencies]
# The contract test asserts the node's declaration defaults; the protocol itself
# names no config type (the ordering claim is that frames do not depend on config).
effector-config = { path = "../config" }
# The attachment claim is a claim about BOTH codecs: a byte string in CBOR (one header, not one
# integer per byte), an array in JSON (the only spelling it has).
ciborium = "0.2"

[lints]
workspace = true
