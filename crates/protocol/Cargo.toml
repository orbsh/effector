[package]
name = "effector-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# The pipe protocol owns its frame vocabulary and its codec declaration
# (ADR-0001 §Consequences: effector takes induction-protocol for frames and
# the codec enum) — `ToolCall.encoding` is that type, not a second copy.
induction-protocol = { path = "../../../induction/crates/induction-protocol" }
# The registration challenge is SIGNED (ADR-0002): the wire carries a public key and a
# signature, so the two primitives it needs live here with the frame vocabulary — one
# implementation of the signed message, both ends, so the two can never drift apart.
ed25519-dalek = "2.2"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
anyhow = "1"

[dev-dependencies]
# The contract test asserts the node's declaration defaults; the protocol itself
# names no config type (the ordering claim is that frames do not depend on config).
effector-config = { path = "../config" }

[lints]
workspace = true
