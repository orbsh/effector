[package]
name = "effector-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true

# The privileged component (ADR-0003 §10): it holds the Docker socket and mints the node's
# token. It never runs delivered code — that is the node's job, inside the container.
[[bin]]
name = "effector-launch"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }